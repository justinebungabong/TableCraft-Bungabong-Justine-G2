{% extends "base.html" %}
{% block title %}Password updated | TableCraft{% endblock %}

{% block content %}
<div class="container-fluid py-5" style="max-width: 720px;">
  <div class="card">
    <div class="card-body p-4 p-md-5">
      <p class="text-uppercase small fw-bold mb-2" style="letter-spacing: .12em; color: #b4562a;">Account</p>
      <h1 class="h4 fw-bold mb-2">Your password has been updated</h1>
      <p class="mb-4" style="color: var(--muted);">
        Use the new password the next time you sign in on this or any other station.
      </p>
      <a href="{% url 'accounts:profile' %}" class="btn btn-dark btn-sm">Back to my profile</a>
    </div>
  </div>
</div>
{% endblock %}
